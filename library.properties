sentence=Dust sensors PMS5003, PMS7003, PMSA003 (Plantower): PM1.0, PM2.5, PM10, AQI, particle counts, sleep and passive mode, checked frames. No dependencies.
paragraph=Reads Plantower PMS5003, PMS7003, PMSA003, PMS1003 and PMS3003 dust sensors over UART without blocking: update() in loop(), pm1(), pm25(), pm10(), particle counts, the US EPA air quality index aqi() with a verbal rating, frame checksum verification, resynchronization after garbage, active and passive mode, sleep and wake to extend the sensor life. Works with any port (Serial, Serial2, SoftwareSerial). Explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
